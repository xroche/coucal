# Build and test coucal across compilers, architectures, the 32-bit ABI,
# sanitizers, and macOS. The library ships as a hand-written Makefile, so CI
# drives that Makefile directly: it is exactly what rotted unnoticed before
# (a stale link order made `make` fail on modern toolchains, with no CI to
# catch it).
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Least privilege: the workflow only needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same branch or PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build+test (${{ matrix.arch }}, ${{ matrix.cc }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86-64, runner: ubuntu-24.04,     cc: gcc }
          - { arch: x86-64, runner: ubuntu-24.04,     cc: clang }
          - { arch: arm64,  runner: ubuntu-24.04-arm, cc: gcc }
          - { arch: arm64,  runner: ubuntu-24.04-arm, cc: clang }
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang

      # `make all` builds the static lib, shared lib, tests, and sample under
      # the chosen compiler; `make check` runs the test suite.
      - name: Build and test
        run: make all check CC=${{ matrix.cc }}

  sanitizers:
    name: sanitizers (asan+ubsan, gcc)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential

      # The hashtable is pointer- and offset-heavy: the string pool realloc()
      # moves interior key pointers and recomputes them by offset. ASan/UBSan
      # are the cheapest guard against the use-after-free / out-of-bounds class
      # of bug on that path. Flags ride in via CFLAGS/LDFLAGS, which the
      # Makefile appends its mandatory flags onto.
      # Poison fresh allocations with 0xCA and freed blocks with 0xCB so memory
      # never reads back as accidental zeros: a stale interior key pointer or a
      # missing-NUL then dereferences a redzone instead of a lucky 0. calloc'd
      # memory (the items table) stays zeroed, so the name==NULL free-slot check
      # is unaffected. Leaks are in scope here -- the suite frees everything, so
      # detect_leaks=1 stays on -- and every finding aborts the run.
      - name: Build and run under ASan + UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:halt_on_error=1:strict_string_checks=1:malloc_fill_byte=202:max_malloc_fill_size=2147483647:free_fill_byte=203:max_free_fill_size=2147483647
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          set -euo pipefail
          make check \
            CFLAGS="-O1 -g -fsanitize=address -fsanitize=undefined -fno-sanitize-recover=all -fno-omit-frame-pointer" \
            LDFLAGS="-fsanitize=address -fsanitize=undefined"

  abi32:
    name: build+test (linux i386, gcc -m32)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install 32-bit toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential gcc-multilib

      # Exercises the 32-bit pointer / size_t ABI, where the string-pool offset
      # math (the uintptr_t pointer recompute) can truncate or wrap in ways the
      # 64-bit build never reveals.
      - name: Build and test (-m32)
        run: make all check CC="gcc -m32"

  macos:
    name: build+test (macOS arm64, clang)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      # The Makefile is portable (it switches to a .dylib link on Darwin), so
      # macOS runs the same `make all check`. This exercises the code on a
      # second libc/kernel and on Apple clang.
      - name: Build and test
        run: make all check

  # Build and test every non-default hash backend and the 64-bit key width.
  # Only the default (MurmurHash / 32-bit, covered by the `build` matrix above)
  # was ever compiled, so the FNV1, 64-bit and OpenSSL-MD5 configs had silently
  # rotted (they failed to build under -Werror). This leg keeps them honest.
  # MURMUR/32 is omitted here -- the build matrix already covers it.
  config-matrix:
    name: config (${{ matrix.backend }}, ${{ matrix.size }}-bit)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { backend: MURMUR,      size: 64 }
          - { backend: FNV1,        size: 32 }
          - { backend: FNV1,        size: 64 }
          - { backend: OPENSSL_MD5, size: 32 }
          - { backend: OPENSSL_MD5, size: 64 }
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          # libssl-dev only matters for the OPENSSL_MD5 backend; harmless otherwise.
          sudo apt-get install -y --no-install-recommends build-essential libssl-dev

      - name: Build and test
        run: make all check HASH_BACKEND=${{ matrix.backend }} HASH_SIZE=${{ matrix.size }}

  # HTTrack builds coucal (its src/coucal submodule) with -DHTS_INTHASH_USES_MD5
  # and supplies its own md5.h, so that backend cannot build standalone. We can't
  # run it here, but we compile-check the branch under -Werror against an
  # API-compatible stub header (ci/md5-stub/md5.h) so it can't rot on the coucal
  # side between submodule bumps. Full functional coverage lives in httrack's CI.
  md5-smoke:
    name: config (bundled MD5, compile-only)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential

      - name: Compile the bundled-MD5 branch (32- and 64-bit)
        run: |
          set -euo pipefail
          flags="-O2 -g -W -Wall -Wextra -Werror -Wno-unused-function \
            -D_REENTRANT -Ici/md5-stub -DHTS_INTHASH_USES_MD5"
          cc $flags -c coucal.c -o /dev/null
          cc $flags -DCOUCAL_HASH_SIZE=64 -c coucal.c -o /dev/null

  # MemorySanitizer catches reads of uninitialized memory that ASan/UBSan miss.
  # coucal's default build uses only libc (which MSan intercepts), so the whole
  # library is instrumented -- no uninstrumented dependency to flood the run
  # with false positives. Static build (tests link the archive); flags ride in
  # via CFLAGS/LDFLAGS, which the Makefile appends its mandatory flags onto.
  msan:
    name: msan (MemorySanitizer, clang)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang

      - name: Build and test under MSan
        env:
          MSAN_OPTIONS: abort_on_error=1:halt_on_error=1
        run: |
          set -euo pipefail
          make check CC=clang \
            CFLAGS="-fsanitize=memory -fsanitize-memory-track-origins=2 -fno-sanitize-recover=all -g -O1 -fno-omit-frame-pointer" \
            LDFLAGS="-fsanitize=memory"

  # Differential fuzzing: fuzz/coucal_fuzz.c drives coucal and a reference model
  # in lockstep over a fuzzer-decoded op stream, aborting on any divergence.
  # Build the harness with libFuzzer and replay the committed seed corpus under
  # ASan+UBSan+LeakSanitizer. Replay (not open-ended mutation) keeps CI
  # deterministic and pins the seeds; deep discovery is a manual / OSS-Fuzz job.
  fuzz:
    name: fuzz (libFuzzer corpus replay, clang)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang

      - name: Build harness and replay corpus
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: bash fuzz/run-fuzzers.sh
